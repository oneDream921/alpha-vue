spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: ${DB_POOL_MIN_IDLE:2}
      min-idle: ${DB_POOL_MIN_IDLE:2}
      max-active: ${DB_POOL_MAX_SIZE:10}
      max-wait: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: ${DRUID_FILTERS:stat}
      web-stat-filter:
        enabled: ${DRUID_WEB_STAT_ENABLED:true}
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*,/actuator/*,/doc.html,/v3/api-docs/*"
      stat-view-servlet:
        enabled: ${DRUID_ENABLED:true}
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:alpha}
        login-password: ${DRUID_PASSWORD:alpha-druid}
        allow: ${DRUID_ALLOW:127.0.0.1}
        reset-enable: false
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: ${SQL_SLOW_THRESHOLD_MS:500}
          merge-sql: true
        wall:
          enabled: ${DRUID_WALL_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      client-name: ${REDIS_CLIENT_NAME:alpha-server}
      lettuce:
        pool:
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
          max-idle: ${REDIS_POOL_MAX_IDLE:4}
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
          time-between-eviction-runs: ${REDIS_POOL_EVICTION_INTERVAL:30s}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${MYSQL_URL}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    locations: classpath:db/migration

sa-token:
  token-name: ${SA_TOKEN_NAME:Authorization}
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:28800}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: ${SA_TOKEN_IS_CONCURRENT:true}
  is-share: ${SA_TOKEN_IS_SHARE:false}
  token-style: ${SA_TOKEN_STYLE:uuid}
  is-log: ${SA_TOKEN_IS_LOG:false}

alpha:
  auth:
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    captcha-ttl: ${CAPTCHA_TTL:5m}
  monitor:
    sql:
      max-entries: ${SQL_LOG_MAX_ENTRIES:200}
      slow-threshold-ms: ${SQL_SLOW_THRESHOLD_MS:500}
      druid-enabled: ${DRUID_ENABLED:true}
      druid-path: ${DRUID_PATH:/druid/index.html}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

knife4j:
  enable: true
