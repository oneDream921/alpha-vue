spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AlphaVueHikariPool
      register-mbeans: true
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:30000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      client-name: ${REDIS_CLIENT_NAME:alpha-server}
      lettuce:
        pool:
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
          max-idle: ${REDIS_POOL_MAX_IDLE:4}
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
          time-between-eviction-runs: ${REDIS_POOL_EVICTION_INTERVAL:30s}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

sa-token:
  token-name: ${SA_TOKEN_NAME:Authorization}
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:28800}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: ${SA_TOKEN_IS_CONCURRENT:true}
  is-share: ${SA_TOKEN_IS_SHARE:false}
  token-style: ${SA_TOKEN_STYLE:uuid}
  is-log: ${SA_TOKEN_IS_LOG:false}

alpha:
  auth:
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    captcha-ttl: ${CAPTCHA_TTL:5m}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

knife4j:
  enable: true
