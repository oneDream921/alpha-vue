services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy/.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in deploy/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
    ports:
      - "${MYSQL_PORT:?Set MYSQL_PORT in deploy/.env}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    ports:
      - "${REDIS_PORT:?Set REDIS_PORT in deploy/.env}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG;
          else
            redis-cli ping | grep PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env}
    ports:
      - "${MINIO_API_PORT:?Set MINIO_API_PORT in deploy/.env}:9000"
      - "${MINIO_CONSOLE_PORT:?Set MINIO_CONSOLE_PORT in deploy/.env}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in deploy/.env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in deploy/.env}
    volumes:
      - ./minio-policy.json:/config/minio-policy.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing local/alpha-vue >/dev/null &&
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null &&
        mc admin policy create local alpha-vue-rw /config/minio-policy.json >/dev/null &&
        mc admin policy attach local alpha-vue-rw --user "$$MINIO_ACCESS_KEY" >/dev/null

  snailjob-db:
    profiles: ["snailjob"]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SNAILJOB_MYSQL_DATABASE:-snail_job}
      MYSQL_USER: ${SNAILJOB_MYSQL_USER:-snail_job}
      MYSQL_PASSWORD: ${SNAILJOB_MYSQL_PASSWORD:-change-me-snailjob-password}
      MYSQL_ROOT_PASSWORD: ${SNAILJOB_MYSQL_ROOT_PASSWORD:-change-me-snailjob-root-password}
    ports:
      - "${SNAILJOB_MYSQL_PORT:-13307}:3306"
    volumes:
      - snailjob-mysql-data:/var/lib/mysql
      - ./snailjob-schema.sql:/docker-entrypoint-initdb.d/001-snailjob.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  snailjob:
    profiles: ["snailjob"]
    image: opensnail/snail-job:2.0.2
    restart: unless-stopped
    depends_on:
      snailjob-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://snailjob-db:3306/${SNAILJOB_MYSQL_DATABASE:-snail_job}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${SNAILJOB_MYSQL_USER:-snail_job}
      SPRING_DATASOURCE_PASSWORD: ${SNAILJOB_MYSQL_PASSWORD:-change-me-snailjob-password}
      SNAIL_JOB_SERVER_PORT: 17888
    ports:
      - "${SNAILJOB_HTTP_PORT:-26300}:8080"
      - "${SNAIL_JOB_SERVER_PORT:-26888}:17888"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --location http://localhost:8080/snail-job >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - snailjob-data:/snailjob/server/data

volumes:
  mysql-data:
  redis-data:
  minio-data:
  snailjob-mysql-data:
    # Keep the existing local SnailJob database volume when the Compose
    # project name changes, so local scheduler data and credentials survive
    # the stack alignment.
    name: alpha-vue-snailjob_snailjob-mysql-data
    external: true
  snailjob-data:
