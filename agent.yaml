schema: 1
platforms:
  - codex
  - claude
  - cursor
customization:
  rules: .project-agent/rules
  skills: .project-agent/skills
  memory: docs/ai
codex:
  hooks:
    # 仅检查 Codex 本次编辑的文件；命令不得修改源码。
    checks:
      - patterns:
          - "**/*.json"
          - "**/*.js"
          - "**/*.mjs"
          - "**/*.ts"
          - "**/*.tsx"
          - "**/*.vue"
        command:
          - node
          - scripts/afk-check-changed.mjs
          - "{files}"
        timeout: 60
projects:
  - name: alpha-vue
    path: .
    type: application
    stack: vue3-spring-boot
