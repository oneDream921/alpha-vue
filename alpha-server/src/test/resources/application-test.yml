spring:
  datasource:
    url: jdbc:h2:mem:alpha_vue;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    url: jdbc:h2:mem:alpha_vue;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    user: sa
    password:
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

springdoc:
  enable-javadoc: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 28800
  active-timeout: 1800
  is-log: false

alpha:
  monitor:
    redis:
      metrics-enabled: false
    sql:
      max-entries: 20
      slow-threshold-ms: 500
      retention-ms: 1800000
      max-sql-length: 4096
  file:
    access-token-secret: test-file-access-secret
    access-token-ttl: 5m
  test-token:
    user-id: 1
    value: alpha-test-admin-token
    timeout-seconds: 28800
