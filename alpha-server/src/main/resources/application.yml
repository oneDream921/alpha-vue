spring:
  application:
    name: alpha-server
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_BYTES:10485760}
      max-request-size: ${FILE_MAX_REQUEST_SIZE_BYTES:12582912}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Shanghai}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

sa-token:
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-lasting-cookie: false

snail-job:
  enabled: ${SNAIL_JOB_ENABLED:false}
  namespace: ${SNAIL_JOB_NAMESPACE:alpha-local}
  group: ${SNAIL_JOB_GROUP:alpha-vue}
  token: ${SNAIL_JOB_TOKEN:}
  host: ${SNAIL_JOB_CLIENT_HOST:}
  port: ${SNAIL_JOB_CLIENT_PORT:17889}
  server:
    host: ${SNAIL_JOB_SERVER_HOST:localhost}
    port: ${SNAIL_JOB_SERVER_PORT:26888}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    enabled: false
  enable-javadoc: false

alpha:
  web:
    trusted-proxies: ${TRUSTED_PROXY_ADDRESSES:}
    ip-location-xdb: ${IP_LOCATION_XDB:}
  file:
    provider: ${FILE_STORAGE_PROVIDER:local}
    allowed-extensions: ${FILE_ALLOWED_EXTENSIONS:txt,pdf,png,jpg,jpeg,gif,webp,doc,docx,xls,xlsx}
    max-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}
    local-root: ${FILE_LOCAL_ROOT:uploads}
    local-public-url: ${FILE_LOCAL_PUBLIC_URL:/uploads}
    public-access: ${FILE_PUBLIC_ACCESS:false}
    access-token-secret: ${FILE_ACCESS_TOKEN_SECRET:}
    access-token-ttl: ${FILE_ACCESS_TOKEN_TTL:5m}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:alpha-vue}
      public-url: ${MINIO_PUBLIC_URL:}
  monitor:
    redis:
      mask-values: ${REDIS_MASK_VALUES:true}
      metrics-enabled: ${REDIS_METRICS_ENABLED:true}
      metrics-sample-interval-ms: ${REDIS_METRICS_SAMPLE_INTERVAL_MS:60000}
      metrics-retention-ms: ${REDIS_METRICS_RETENTION_MS:86400000}
      metrics-max-samples: ${REDIS_METRICS_MAX_SAMPLES:1440}
  log:
    capture-business-exception-stack: ${AUDIT_CAPTURE_BUSINESS_EXCEPTION_STACK:false}
    stream:
      enabled: ${AUDIT_STREAM_ENABLED:true}
      stream-key: ${AUDIT_STREAM_KEY:alpha:audit:operation:v1}
      dead-letter-stream-key: ${AUDIT_STREAM_DLQ_KEY:alpha:audit:operation:dlq:v1}
      consumer-group: ${AUDIT_STREAM_CONSUMER_GROUP:alpha-audit-db}
      consumer-name: ${AUDIT_STREAM_CONSUMER_NAME:}
      batch-size: ${AUDIT_STREAM_BATCH_SIZE:100}
      read-timeout-ms: ${AUDIT_STREAM_READ_TIMEOUT_MS:1000}
      poll-delay-ms: ${AUDIT_STREAM_POLL_DELAY_MS:1000}
      initial-delay-ms: ${AUDIT_STREAM_INITIAL_DELAY_MS:1000}
      claim-idle-ms: ${AUDIT_STREAM_CLAIM_IDLE_MS:60000}
      max-delivery-count: ${AUDIT_STREAM_MAX_DELIVERY_COUNT:10}
  maintenance:
    enabled: ${MAINTENANCE_ENABLED:true}
    spring-scheduler-enabled: ${MAINTENANCE_SPRING_SCHEDULER_ENABLED:true}
    initial-delay-ms: ${MAINTENANCE_INITIAL_DELAY_MS:300000}
    fixed-delay-ms: ${MAINTENANCE_FIXED_DELAY_MS:3600000}
    logs:
      enabled: ${MAINTENANCE_LOG_CLEANUP_ENABLED:true}
      dry-run: ${MAINTENANCE_LOG_CLEANUP_DRY_RUN:true}
      retention-days: ${MAINTENANCE_LOG_RETENTION_DAYS:90}
      batch-size: ${MAINTENANCE_LOG_CLEANUP_BATCH_SIZE:1000}
    temp-files:
      enabled: ${MAINTENANCE_TEMP_FILE_CLEANUP_ENABLED:true}
      dry-run: ${MAINTENANCE_TEMP_FILE_CLEANUP_DRY_RUN:true}
      retention-ms: ${MAINTENANCE_TEMP_FILE_RETENTION_MS:86400000}
      batch-size: ${MAINTENANCE_TEMP_FILE_CLEANUP_BATCH_SIZE:1000}
    storage-consistency:
      enabled: ${MAINTENANCE_STORAGE_CONSISTENCY_ENABLED:true}
      batch-size: ${MAINTENANCE_STORAGE_CONSISTENCY_BATCH_SIZE:200}
    sessions:
      enabled: ${MAINTENANCE_SESSION_INDEX_REPAIR_ENABLED:true}
      dry-run: ${MAINTENANCE_SESSION_INDEX_REPAIR_DRY_RUN:true}
      batch-size: ${MAINTENANCE_SESSION_INDEX_REPAIR_BATCH_SIZE:1000}
    health-summary:
      enabled: ${MAINTENANCE_HEALTH_SUMMARY_ENABLED:true}
