spring:
  datasource:
    url: jdbc:h2:mem:alpha_p1_03;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    url: jdbc:h2:mem:alpha_p1_03;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    user: sa
    password:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_TEST_HOST:127.0.0.1}
      port: ${REDIS_TEST_PORT:26379}
      password:
      database: 15
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

alpha:
  redis:
    redisson:
      host: ${REDIS_TEST_HOST:127.0.0.1}
      port: ${REDIS_TEST_PORT:26379}
      password:
      database: 15
      timeout: 1s
      connect-timeout: 1s
      connection-pool-size: 4
      connection-minimum-idle-size: 1
      retry-interval: 100ms
      retry-attempts: 1
      cache-ttl: 2s
  file:
    access-token-secret: test-file-access-secret
    access-token-ttl: 5m
