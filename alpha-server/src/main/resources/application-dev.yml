spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_THRESHOLD_MS:0}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${MYSQL_URL}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    locations: classpath:db/migration

sa-token:
  token-name: ${SA_TOKEN_NAME:Authorization}
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:28800}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: ${SA_TOKEN_IS_CONCURRENT:true}
  is-share: ${SA_TOKEN_IS_SHARE:false}
  token-style: ${SA_TOKEN_STYLE:uuid}
  is-log: ${SA_TOKEN_IS_LOG:false}

alpha:
  redis:
    redisson:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      connection-pool-size: ${REDIS_POOL_MAX_ACTIVE:8}
      connection-minimum-idle-size: ${REDIS_POOL_MIN_IDLE:1}
      retry-interval: ${REDIS_RETRY_INTERVAL:1s}
      retry-attempts: ${REDIS_RETRY_ATTEMPTS:2}
      cache-ttl: ${REDIS_CACHE_TTL:10m}
  auth:
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    captcha-ttl: ${CAPTCHA_TTL:5m}
  monitor:
    sql:
      max-entries: ${SQL_LOG_MAX_ENTRIES:200}
      slow-threshold-ms: ${SQL_SLOW_THRESHOLD_MS:500}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  enable-javadoc: true
